checks:
  image-check: &pharo
    profile: linux-worktree-v1
    epoch: pharo-v1
    sources:
      mode: worktree
    runtime:
      platforms:
        linux-amd64:
          bundle: pharo-handoff-linux-amd64.tar.gz
          sha256: 528b41bc275148ec6bd28365b424c80acafdf63ffdd77946cfaf30aab09ee06d
          env:
            MAKEFLAGS: >-
              IMAGE_DIR={scratch}/image VM={runtime}/vm/pharo
              PID_FILE={scratch}/pharo.pid LOG_FILE={scratch}/pharo.log
    system:
      tools: [bash, sh, env, dirname, uname, ldd, fgrep, expr, make, curl, cat, grep, sed, seq, sleep]
    scratch:
      checkout: [.tmp]
      seed:
        "{scratch}/image": "{runtime}/image"
    git:
      base_ref: refs/remotes/origin/main
    network: loopback
    prehydrate:
      run:
        - "{runtime}/vm/pharo"
        - "{scratch}/image/Pharo.image"
        - eval
        - --save
        - >-
          | repo |
          repo := IceRepositoryCreator new
            location: (OSEnvironment current at: 'ETHOS_HANDOFF_ROOT') asFileReference;
            createRepository.
          repo name: (OSEnvironment current at: 'ETHOS_HANDOFF_CHECKOUT_NAME'); register.
  fast-tests: *pharo
