name: pharo
description: Advisory shell feedback on edit; image lint at commit and full gates at handoff.
checks:
  - name: shellcheck-edit
    stage: edit
    files: ["**/*.sh"]
    run: [shellcheck, "{file}"]
    on_fail: advisory
    timeout: 5s
  - name: shellcheck-commit
    stage: commit
    files: ["**/*.sh"]
    run: [shellcheck, "{files}"]
    on_fail: block
    timeout: 120s
  - name: image-lint
    stage: commit
    files: all
    adapter: make
    target: gate-lint
    on_fail: block
    timeout: 120s
  - name: image-check
    stage: handoff
    files: all
    adapter: make
    target: gate-check
    on_fail: block
    timeout: 10m
  - name: fast-tests
    stage: handoff
    files: all
    adapter: make
    target: gate-test-fast
    on_fail: block
    timeout: 10m
